# RPCS3 needs generous memory overcommit for its large sparse VM reservations: it
# reserves ~32 GiB of address space that is almost never resident. Fedora's default
# (vm.overcommit_memory = 0, heuristic) refuses that single reservation on an 8 GB box
# and the OOM-killer takes rpcs3 despite a tiny real RSS. Mode 1 = always overcommit —
# the pages are lazy, so only real resident use counts. See BUILDING.md §5.2.
vm.overcommit_memory = 1
